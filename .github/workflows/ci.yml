name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit, Composer, and BookStack browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Validate Composer package
        run: |
          php -l bin/bookstack-file-preview
          composer validate --no-check-publish

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and test against the latest BookStack release
        env:
          BOOKSTACK_IMAGE: lscr.io/linuxserver/bookstack:latest
        run: npm run test:bookstack

      - name: Upload BookStack theme module
        uses: actions/upload-artifact@v7
        with:
          name: file-attachment-preview-bookstack-module
          path: dist/file-attachment-preview.zip
          if-no-files-found: error

      - name: Stop the disposable BookStack test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes

  release:
    name: Publish Composer install asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download tested BookStack module
        uses: actions/download-artifact@v7
        with:
          name: file-attachment-preview-bookstack-module
          path: dist

      - name: Publish the module ZIP as a GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/file-attachment-preview.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/file-attachment-preview.zip \
              --title "File Attachment Preview $GITHUB_REF_NAME" --generate-notes
          fi
